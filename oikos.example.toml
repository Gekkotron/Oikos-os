[mqtt]
host = "192.168.1.91"
port = 1883
user = "oikos"
password = "change-me"
client_id = "oikos-os"
send_ha_birth = false
ha_status_topic = "homeassistant/status"

[topics]
discovery_prefixes = ["oikos"]
ui_prefix = "oikos/ui"
z2m_base = "zigbee2mqtt"
# Flow definitions are retained JSON documents at <automation_prefix>/<flow id>.
automation_prefix = "oikos/automation"

[http]
bind = "0.0.0.0:8081"

[commands]
confirm_timeout_ms = 5000
subscription_debounce_ms = 500

# The flow engine. `runs_kept` is how many recent runs the hub remembers per flow.
[automation]
runs_kept = 20

# Flow schedules (`trigger.schedule`) run in this IANA time zone. Leave it out to use the
# system's zone; an unknown name falls back to UTC.
[flows]
# timezone = "Europe/Paris"

[log]
level = "info"
json = false

# Push notifications, sent by the hub through Firebase Cloud Messaging. Producers publish on
# <prefix>/notification/<source>, the app registers on <prefix>/tokens/<installId> and replies
# on <prefix>/responses, the hub keeps the retained <prefix>/history the web UI shows under Alerts.
[push]
prefix = "oikos/push"
# OikosPush's topics (<legacy>/notification/+, /tokens/+, /history), still read during the
# switch-over. An empty string turns them off.
legacy_prefix = "oikos-push"
# The Firebase service-account key file (keep it out of git). Without it the hub keeps the
# history and sends nothing; a missing or unreadable file is the same, with a warning.
# credentials = "/path/to/firebase-service-account.json"
# Seconds between retries of a failed send, and attempts before it is given up.
retry_interval = 60
max_retries = 10
# Alerts kept in the history, and for how many days.
history_size = 100
history_days = 7

# Frigate, for alert snapshots and clips. With `url` set, media on that origin is served by the
# hub at /api/v1/media (the browser never sees the login). Needed when alerts point at Frigate's
# login port (8971); leave `user`/`password` empty for the unauthenticated port (5000).
[frigate]
url = ""
user = ""
password = ""
# The Frigate event bridge: turns `<topic_prefix>/events` into push alerts (needs `url` or
# `media_url`). `media_url` is the base URL the *phone* fetches snapshots and clips from,
# `url` when unset; use the unauthenticated port (5000), the app sends no login.
# bridge = true
# media_url = "http://192.168.1.20:5000"
# labels = ["person", "car"]     # empty: all
# cameras = []                   # empty: all
# zones = []                     # empty: any; otherwise alert once the object enters one
# cooldown = 0                   # seconds to ignore new events on a camera after an alert
# severity = "warning"           # info, warning or critical
# ttl = 43200                    # seconds
# topic_prefix = "frigate"       # Frigate's MQTT topic_prefix

# TimescaleDB connection for the entity-state history. An empty url turns history off (the
# house keeps running, the /api/v1/history/* routes answer 503). `buffer_rows` is how many
# pending states the writer keeps when the database is unreachable, before dropping the
# oldest.
[history]
# url = "postgres://oikos:change-me@192.168.1.91:5432/oikos"
# buffer_rows = 100000

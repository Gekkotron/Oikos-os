# Oikos-os single-host Docker Compose.
# See docs/users/install-on-linux.md for the full install.
#
# The hub only needs its own container. Mosquitto, TimescaleDB and
# (optionally) Frigate are expected to run on the same host; `network_mode:
# host` makes `localhost` inside the container the host's localhost.

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: oikos-os:local
    container_name: oikos-hub
    restart: unless-stopped
    network_mode: host
    # Optional, git-ignored: any OIKOS_* override (see oikos.example.toml).
    env_file:
      - path: .env
        required: false
    volumes:
      - ./oikos.toml:/etc/oikos/oikos.toml:ro
      # Git-ignored keys. The hub sends push notifications when
      # secrets/firebase.json is there; see secrets/README.md.
      - ./secrets:/etc/oikos/secrets:ro

<!-- Oikos-os icon (Gekkotron). Source of the Android adaptive icon layers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <defs>
    <clipPath id="plate"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
    <radialGradient id="sky" cx="54" cy="18" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c4386"/>
      <stop offset="0.5" stop-color="#141d42"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <radialGradient id="halo" cx="54" cy="64" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc457" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffc457" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffc457" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="48" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f3a23e"/>
    </linearGradient>
    <linearGradient id="roof" x1="30" y1="33" x2="78" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="1" stop-color="#e2583c"/>
    </linearGradient>
    <radialGradient id="light" cx="54" cy="62" r="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#ffe7a8"/>
      <stop offset="1" stop-color="#ffc457"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#plate)">
  <!-- background layer -->
  <g id="background">
    <rect width="108" height="108" fill="url(#sky)"/>
    <g fill="#fff4dc">
      <circle cx="31" cy="31" r="0.9" fill-opacity="0.9"/>
      <circle cx="40" cy="22" r="0.6" fill-opacity="0.6"/>
      <circle cx="24" cy="44" r="0.6" fill-opacity="0.5"/>
      <circle cx="84" cy="44" r="0.8" fill-opacity="0.7"/>
      <circle cx="60" cy="21" r="0.5" fill-opacity="0.5"/>
      <circle cx="87" cy="62" r="0.5" fill-opacity="0.4"/>
      <circle cx="21" cy="64" r="0.7" fill-opacity="0.45"/>
      <!-- crescent moon -->
      <path d="M77 27 A6 6 0 1 0 82.6 36.2 A4.8 4.8 0 1 1 77 27 Z" fill-opacity="0.95"/>
    </g>
    <path d="M0 82 Q30 72 54 74 Q80 76 108 70 V108 H0 Z" fill="#101936"/>
    <path d="M0 82 Q30 72 54 74 Q80 76 108 70" fill="none" stroke="#2c4386" stroke-opacity="0.5" stroke-width="0.6"/>
  </g>
  <!-- foreground layer -->
  <g id="foreground">
    <circle cx="54" cy="64" r="34" fill="url(#halo)"/>
    <g transform="translate(54 56) scale(0.84) translate(-54 -56)">
    <!-- chimney -->
    <path d="M64 36.5 Q64 35 65.5 35 H69.5 Q71 35 71 36.5 V48 H64 Z" fill="#d9573c"/>
    <!-- walls -->
    <path d="M35 49 H73 V76 Q73 79 70 79 H38 Q35 79 35 76 Z" fill="url(#wall)"/>
    <!-- eave shadow -->
    <path d="M35 49 H73 V53.5 L54 52 L35 53.5 Z" fill="#c9702e" fill-opacity="0.35"/>
    <!-- roof -->
    <path d="M29.5 52.5 L54 32.5 L78.5 52.5" fill="none" stroke="url(#roof)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- lit window -->
    <rect x="45" y="56" width="18" height="15" rx="2.2" fill="url(#light)"/>
    <!-- the Easter egg: a cat watching the night from the window -->
    <g transform="translate(51 71) scale(0.78) translate(-51 -71)">
    <path d="M48.6 71 C47.6 68.4 47.9 65.8 49.1 64.4 L48.7 61.6 L50.3 63 Q51 62.8 51.7 63 L53.1 61.6 L52.9 64.4 C54 65.7 54.1 68.5 53.3 71 Z" fill="#2a1f2e"/>
    <path d="M53.1 70.6 Q55.6 70.4 55.4 67.6" fill="none" stroke="#2a1f2e" stroke-width="0.9" stroke-linecap="round"/>
    </g>
    <!-- window bars -->
    <path d="M54 56 V71 M45 63.5 H63" stroke="#c97a2c" stroke-width="1.4"/>
    <rect x="45" y="56" width="18" height="15" rx="2.2" fill="none" stroke="#c97a2c" stroke-width="1.4"/>
    <!-- sill -->
    <rect x="43.5" y="70.6" width="21" height="2" rx="1" fill="#e08a36"/>
    </g>
  </g>
</g>
</svg>

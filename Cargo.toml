[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/Gekkotron/Oikos-os"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
rumqttc = "0.25"
axum = { version = "0.8", features = ["ws", "json"] }
rmcp = { version = "3.5", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-io"] }
minijinja = { version = "3", features = ["json", "builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
croner = { version = "4", default-features = false, features = ["chrono"] }
anyhow = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
url = "2"
tower-http = { version = "0.7", features = ["fs", "cors"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = "1"
assert_cmd = "2.2"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-net = { version = "0.6", features = ["websocket", "http"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "MediaQueryList", "MediaQueryListEvent", "Location"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen-test = "0.3"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros"] }

# Keep `target/` small: line tables only for our crates, no debug info and a little
# optimisation for dependencies (native and wasm). Release builds are untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

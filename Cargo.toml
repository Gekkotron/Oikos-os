[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/Gekkotron/Oikos-os"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
rumqttc = "0.25"
axum = { version = "0.8", features = ["ws", "json"] }
rmcp = { version = "3.5", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-io"] }
minijinja = { version = "3", features = ["json", "builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
uuid = "1"

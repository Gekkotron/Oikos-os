# An old-format oikos.toml, kept only to test that the hub still reads and imports one.
# New installs configure the hub in the setup wizard and Settings; they have no such file.

[mqtt]
host = "192.168.1.20"
port = 1883
user = "oikos"
password = "change-me"
client_id = "oikos-os"
send_ha_birth = false
ha_status_topic = "homeassistant/status"

[topics]
discovery_prefixes = ["oikos"]
ui_prefix = "oikos/ui"
z2m_base = "zigbee2mqtt"
# Flow definitions are retained JSON documents at <automation_prefix>/<flow id>.
automation_prefix = "oikos/automation"

[http]
bind = "0.0.0.0:8081"

[commands]
confirm_timeout_ms = 5000
subscription_debounce_ms = 500

# The flow engine. `runs_kept` is how many recent runs the hub remembers per flow.
[automation]
runs_kept = 20

# Flow schedules (`trigger.schedule`) run in this IANA time zone. Leave it out to use the
# system's zone; an unknown name falls back to UTC.
[flows]
# timezone = "Europe/Paris"

[log]
level = "info"
json = false

# Push notifications, sent by the hub through Firebase Cloud Messaging. Producers publish on
# <prefix>/notification/<source>, the app registers on <prefix>/tokens/<installId> and replies
# on <prefix>/responses, the hub keeps the retained <prefix>/history the web UI shows under Alerts.
[push]
prefix = "oikos/push"
# OikosPush's topics (<legacy>/notification/+, /tokens/+, /history), still read during the
# switch-over. An empty string turns them off.
legacy_prefix = "oikos-push"
# The Firebase service-account key file. Left out, the hub uses secrets/firebase.json next to
# this file when it exists (git-ignored). Without a key the hub keeps the history and sends
# nothing; an unreadable file is the same, with a warning.
# credentials = "/path/to/firebase-service-account.json"
# Seconds between retries of a failed send, and attempts before it is given up.
retry_interval = 60
max_retries = 10
# Alerts kept in the history, and for how many days.
history_size = 100
history_days = 7

# Frigate, for alert snapshots and clips. With `url` set, media on that origin is served by the
# hub at /api/v1/media (the browser never sees the login). Needed when alerts point at Frigate's
# login port (8971); leave `user`/`password` empty for the unauthenticated port (5000).
[frigate]
url = ""
user = ""
password = ""
# The Frigate event bridge: turns `<topic_prefix>/events` into push alerts (needs `url` or
# `media_url`). `media_url` is the base URL the *phone* fetches snapshots and clips from,
# `url` when unset; use the unauthenticated port (5000), the app sends no login.
# bridge = true
# media_url = "http://192.168.1.20:5000"
# labels = ["person", "car"]     # empty: all
# cameras = []                   # empty: all
# zones = []                     # empty: any; otherwise alert once the object enters one
# cooldown = 0                   # seconds to ignore new events on a camera after an alert
# severity = "warning"           # info, warning or critical
# ttl = 43200                    # seconds
# topic_prefix = "frigate"       # Frigate's MQTT topic_prefix
# live = false  # live frames through the hub: readable by every device on the LAN

# Watchdogs that raise `system` push alerts. Both are off by default.
# Gateway health: alerts when a component under `<prefix>/` turns non-ok or recovers.
# [watchdog.gateway]
# enabled = true
# prefix = "encryption-gateway/health"
#
# Broker ACL: alerts on Mosquitto "Denied PUBLISH/SUBSCRIBE/UNSUBSCRIBE" log lines. `source`
# is "topic" (reads `log_topic`; needs `log_dest topic` in mosquitto.conf) or "file" (tails
# `log_file`, which is then required). Repeats of one denial wait `cooldown` seconds.
# [watchdog.acl]
# enabled = true
# source = "topic"
# log_topic = "$SYS/broker/log/#"
# log_file = "/mosquitto/log/mosquitto.log"
# cooldown = 300

# TimescaleDB connection for the entity-state history. An empty url turns history off (the
# house keeps running, the /api/v1/history/* routes answer 503). `buffer_rows` is how many
# pending states the writer keeps when the database is unreachable, before dropping the
# oldest.
[history]
# url = "postgres://oikos:change-me@192.168.1.20:5432/oikos"
# buffer_rows = 100000

# The climate engine (beta, still being tested): learns each room's heating/cooling rules from history (needs [history]),
# asks before applying them (push + web), and keeps managed rooms on them. Everything except
# this switch is edited through MCP and the web Climate screen, as retained JSON under `prefix`.
[climate]
enabled = false
# prefix = "oikos/climate"

# The native alarm (optional, off by default). It is switched on in its settings document (web
# Settings → Alarm, or MCP and HTTP), not here. `prefix` is the topic prefix of its retained documents.
# [alarm]
# prefix = "oikos/alarm"

# Rooftop solar forecast from Solcast. The API key is read from secrets/solcast.key next to
# this config file; `api_key_file = "path"` overrides it (a relative path is resolved against
# the working directory).
# [solcast]
# enabled = false
# sites = ["xxxx-xxxx-xxxx-xxxx"]   # rooftop resource ids from the Solcast Toolkit
# daily_limit = 10                   # this hub's share of the account's daily requests
# api_key_file = "/path/to/solcast.key"

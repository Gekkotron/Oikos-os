<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<script>
// Mirrors theme.rs (parse + attribute + Auto + theme-color); keep in sync. Avoids a flash of the
// wrong theme before wasm boots. Blocked storage still follows the system; nothing ever throws.
(function () {
  var t = null;
  try { t = localStorage.getItem("oikos.theme"); } catch (e) {}
  var light = t === "ivoire" || t === "warm";
  if (t !== "night" && !light) {
    try { light = matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
  }
  try {
    document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#f3f0e8" : "#0b1020");
  } catch (e) {}
})();
</script>
<title>Oikos-os</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link data-trunk rel="rust" data-wasm-opt="s"/>
<link data-trunk rel="css" href="styles/tokens.css"/>
<link data-trunk rel="css" href="styles/fonts.css"/>
<link data-trunk rel="css" href="styles/main.css"/>
<link data-trunk rel="css" href="styles/rooms.css"/>
<link data-trunk rel="css" href="styles/cards.css"/>
<link data-trunk rel="css" href="styles/ambiances.css"/>
<link data-trunk rel="css" href="styles/widgets.css"/>
<link data-trunk rel="css" href="styles/picker.css"/>
<link data-trunk rel="copy-dir" href="assets"/>
</head>
<body>
<!-- Shown while the wasm loads; main.rs removes it once the app is mounted. -->
<div id="boot" class="boot" role="status" aria-label="Loading">
  <img src="/assets/icon.svg" alt="" width="72" height="72">
  <span class="boot__spinner"></span>
</div>
</body>
</html>

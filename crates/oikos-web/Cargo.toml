[package]
name = "oikos-web"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oikos-web"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
chrono-tz = "0.10"
console_error_panic_hook.workspace = true
futures-util.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_router.workspace = true
oikos-api = { path = "../oikos-api" }
oikos-climate = { path = "../oikos-climate" }
oikos-core = { path = "../oikos-core" }
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Document",
    "DomRect",
    "Clipboard",
    "DataTransfer",
    "DragEvent",
    "Element",
    "GainNode",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "OscillatorNode",
    "OscillatorType",
    "PointerEvent",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "WheelEvent",
] }

[dev-dependencies]
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventInit", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "KeyboardEventInit", "History", "Node", "NodeList", "PointerEvent", "PointerEventInit", "DragEvent", "DragEventInit"] }
wasm-bindgen-test.workspace = true
